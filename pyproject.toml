[project]
name = "djdl"
version = "1.0.0"
description = "Download tracks from YouTube, SoundCloud and Spotify straight into rekordbox 7"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.1.1",
    "yt-dlp-ejs>=0.2",
    "mutagen>=1.47",
]

[project.optional-dependencies]
# Spotify links go through spotdl, which drags in a large dependency tree.
# Anyone who only uses YouTube and SoundCloud should not have to carry it.
spotify = ["spotdl>=4.2"]

[project.scripts]
djdl = "djdl.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
